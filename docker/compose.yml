services:
  sct-job:
    image: ${SCT_DOCKER_IMAGE:?Set SCT_DOCKER_IMAGE}
    init: true
    entrypoint: ["/bin/bash", "/opt/sct/agent/docker/run-job.sh"]
    working_dir: /opt/sct/agent
    environment:
      SCT_JOB_KIND: ${SCT_JOB_KIND:-experiment}
      SCT_DOCKER_IMAGE: ${SCT_DOCKER_IMAGE:?Set SCT_DOCKER_IMAGE}
      SCT_DOCKER_IMAGE_ID: ${SCT_DOCKER_IMAGE_ID:-}
      SCT_RECORD_INDEX: ${SCT_RECORD_INDEX:?Set SCT_RECORD_INDEX}
      SCT_METHOD: ${SCT_METHOD:-}
      SCT_MODEL: ${SCT_MODEL:-}
      SCT_PROJECT_DIR: ${SCT_PROJECT_DIR:?Set SCT_PROJECT_DIR}
      SCT_DATASET_PATH: /data/dataset.jsonl
      SCT_RESULT_DIR: /results
      SCT_TEST_FRAMEWORK: ${SCT_TEST_FRAMEWORK:-}
      SCT_FORCE_RERUN: ${SCT_FORCE_RERUN:-0}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-}
      GLM_API_KEY: ${GLM_API_KEY:-}
      GLM_BASE_URL: ${GLM_BASE_URL:-}
      GLM_MODEL: ${GLM_MODEL:-}
      GPT_API_KEY: ${GPT_API_KEY:-}
      GPT_BASE_URL: ${GPT_BASE_URL:-}
      GPT_MODEL: ${GPT_MODEL:-}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      CLAUDE_BASE_URL: ${CLAUDE_BASE_URL:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-}
      QWEN_MODEL: ${QWEN_MODEL:-}
      SCT_LLM_TIMEOUT: ${SCT_LLM_TIMEOUT:-1200}
      SCT_LLM_CONNECT_TIMEOUT: ${SCT_LLM_CONNECT_TIMEOUT:-30}
      SCT_LLM_WRITE_TIMEOUT: ${SCT_LLM_WRITE_TIMEOUT:-60}
      SCT_LLM_POOL_TIMEOUT: ${SCT_LLM_POOL_TIMEOUT:-60}
      SCT_LLM_INVOKE_RETRIES: ${SCT_LLM_INVOKE_RETRIES:-3}
      SCT_LLM_RETRY_WAIT: ${SCT_LLM_RETRY_WAIT:-30}
      SCT_LLM_MAX_OUTPUT_TOKENS: ${SCT_LLM_MAX_OUTPUT_TOKENS:-65536}
      SCT_TEST_TIMEOUT: ${SCT_TEST_TIMEOUT:-7200}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: /opt/sct/agent
    volumes:
      - ${SCT_AGENT_HOST_DIR:?Set SCT_AGENT_HOST_DIR}:/opt/sct/agent:ro
      - ${SCT_DATASET_HOST_PATH:?Set SCT_DATASET_HOST_PATH}:/data/dataset.jsonl:ro
      - ${SCT_RESULT_HOST_DIR:?Set SCT_RESULT_HOST_DIR}:/results
    restart: "no"
